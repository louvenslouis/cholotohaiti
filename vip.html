<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>Activer mon accès VIP — CHOLOTO</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="Logo_Choloto_509.ico?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="Logo_Choloto_509.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="Logo_Choloto_509.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="Logo_Choloto_509.png?v=3" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&family=Syne:wght@800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030509;
      --surface: #0a111f;
      --accent: #F8BB00;
      --accent-rgb: 248, 187, 0;
      --muted: #8e9db3;
      --border: rgba(255, 255, 255, 0.06);
      --glass: rgba(10, 17, 31, 0.7);
      --max-w: 900px;
      --font-main: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-accent: 'Syne', sans-serif;
    }

    /* Base Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; scroll-behavior: smooth; background: var(--bg); color: #f1f5f9; -webkit-font-smoothing: antialiased; }
    body { font-family: var(--font-main); overflow-x: hidden; line-height: 1.6; }
    a { text-decoration: none; transition: 0.3s; }

    /* Visual Background Elements */
    .bg-visual { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .bg-visual::after {
      content: "";
      position: absolute; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04; mix-blend-mode: overlay;
    }
    .bg-glow { position: absolute; width: 100vw; height: 100vw; background: radial-gradient(circle at center, rgba(var(--accent-rgb), 0.08), transparent 70%); top: -50vw; left: -20vw; filter: blur(80px); }

    .container { width: min(var(--max-w), 100% - 48px); margin: 0 auto; }
    
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 20px 0;
      background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-heading); font-weight: 900; font-size: 20px; letter-spacing: -0.8px; color: #fff; }

    .btn-ghost { 
      background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); 
      padding: 10px 20px; border-radius: 100px; font-size: 14px; font-weight: 700;
      transition: 0.3s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }

    main { padding-top: 100px; padding-bottom: 40px; display: flex; flex-direction: column; min-height: 100vh; }

    .title-area { text-align: center; margin-bottom: 40px; }
    h1 { font-family: var(--font-accent); font-size: clamp(24px, 5vw, 42px); margin-bottom: 12px; color: #fff; line-height: 1.2; }
    .subtitle { color: var(--muted); font-size: clamp(14px, 2vw, 18px); max-width: 600px; margin: 0 auto; }

    /* Iframe Card Container */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), 0 0 80px rgba(var(--accent-rgb), 0.05);
      position: relative;
      overflow: hidden;
      flex: 1;
      margin-bottom: 40px;
    }
    .form-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .form-loader {
      position: absolute;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(var(--accent-rgb), 0.1);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    iframe {
      width: 100%;
      height: calc(100vh - 100px);
      min-height: 600px;
      border: none;
      border-radius: 14px;
      display: block;
      background: #fff;
    }

    footer { padding: 60px 0; border-top: 1px solid var(--border); text-align: center; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); margin: 0 10px; }
    footer a:hover { color: var(--accent); }
  </style>
</head>
<body>

  <div class="bg-visual"><div class="bg-glow"></div></div>

  <header>
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="Logo_Choloto_509.png" alt="CHOLOTO Logo" style="height: 36px; width: auto; border-radius: 8px;">
        <span>CHOLOTO</span>
      </a>
      <a href="index.html" class="btn-ghost">Retour à l'accueil</a>
    </div>
  </header>

  <main class="container">
    <div class="title-area">
      <h1>Activer mon accès VIP</h1>
      <p class="subtitle">Complétez le formulaire officiel ci-dessous pour débloquer toutes les fonctionnalités exclusives de CHOLOTO.</p>
    </div>

    <div class="form-card">
      <div class="form-loader" id="loader">
        <div class="spinner"></div>
        <p style="color:var(--muted); font-size: 14px; font-weight: 500;">Chargement du formulaire sécurisé...</p>
      </div>
      <iframe 
        id="gform"
        src="https://docs.google.com/forms/d/e/1FAIpQLSfxDqA9z6pbCru03TRAGdoTTHgVIpV9m0m41UUeIJYnXPjt9A/viewform?embedded=true" 
        onload="hideLoader()">
        Chargement…
      </iframe>
    </div>
  </main>

  <footer>
    <div class="brand" style="justify-content:center; margin-bottom:32px;">
      <img src="Logo_Choloto_509.png" alt="CHOLOTO Logo" style="height: 48px; width: auto; border-radius: 12px;">
      <span class="brand-name" style="font-size:24px; font-family:var(--font-heading); font-weight:900; letter-spacing:-0.8px; color:#fff;">CHOLOTO</span>
    </div>
    <p style="color:var(--muted); font-size:14px; font-weight:500; margin-bottom:16px;">&copy; <span id="year"></span> CHOLOTO. Dòmi pòv, leve rich.</p>
    <div class="footer-links">
      <a href="mailto:contact@choloto.com">contact@choloto.com</a>
      <a href="tel:+50943560633">+509 43 56 0633</a>
      <a href="legal.html">Légal</a>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    
    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }
  </script>
</body>
</html>
