<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>CHOLOTO — Page introuvable</title>

  <link rel="icon" type="image/x-icon" href="Logo_Choloto_509.ico?v=3" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700;800;900&family=Syne:wght@800&display=swap">

  <style>
    :root {
      --bg: #030509;
      --surface: #0a111f;
      --accent: #F8BB00;
      --accent-rgb: 248, 187, 0;
      --muted: #8e9db3;
      --border: rgba(255,255,255,0.06);
      --glass: rgba(10, 17, 31, 0.7);
      --font-main: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-accent: 'Syne', sans-serif;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: #fff;
      font-family: var(--font-main);
      height: 100vh;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(var(--accent-rgb),0.12), transparent 60%),
                  radial-gradient(circle at 70% 80%, rgba(56,189,248,0.08), transparent 60%);
      filter: blur(40px);
    }

    .card {
      position: relative;
      text-align:center;
      padding: 60px 40px;
      border-radius: 32px;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      max-width: 520px;
      width: calc(100% - 40px);
      box-shadow: 0 40px 120px rgba(0,0,0,0.6);
    }

    .code {
      font-family: var(--font-accent);
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(to bottom, #fff, #8e9db3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 28px;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding: 14px 26px;
      border-radius: 100px;
      background: var(--accent);
      color:#000;
      font-weight:800;
      text-decoration:none;
      transition:0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(var(--accent-rgb),0.3);
    }

    .secondary {
      display:block;
      margin-top:14px;
      color: var(--muted);
      font-size: 14px;
      text-decoration:none;
    }

    .secondary:hover {
      color:#fff;
    }
  </style>
</head>

<body>
  <div class="bg"></div>

  <div class="card">
    <div class="code">404</div>
    <h1>Page introuvable</h1>
    <p>
      La ressource demandée n’existe pas ou a été déplacée.
    </p>

    <a class="btn" href="/">Retour à l’accueil</a>
    <a class="secondary" href="https://choloto.com">choloto.com</a>
  </div>
</body>
</html>
